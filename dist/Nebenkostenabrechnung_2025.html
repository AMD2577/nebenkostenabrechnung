/* =============================================================================
 * GESTALTUNG
 * =============================================================================
 * Zwei Welten in einer Datei:
 *   1. BILDSCHIRM - die Bedienoberfläche (Reiter, Tabellen, Schalter)
 *   2. DRUCK      - die Abrechnungsschreiben auf A4
 * Im Druck wird die Oberfläche komplett ausgeblendet; übrig bleiben nur die
 * Schreiben, jedes auf einer eigenen Seite. Deshalb sieht man am Bildschirm
 * genau das, was später auf dem Papier steht.
 * ========================================================================== */

:root {
  --papier: #ffffff;
  --hintergrund: #f4f6f8;
  --linie: #dfe3e8;
  --text: #1b1f24;
  --gedaempft: #5f6b7a;
  --akzent: #1f4e8c;
  --gut: #1a7f4b;
  --warnung: #b45309;
  --schlecht: #b91c1c;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  color: var(--text);
  background: var(--hintergrund);
}

/* --- Kopf und Reiter ------------------------------------------------------ */
header.kopf {
  background: #fff; border-bottom: 1px solid var(--linie);
  padding: 12px 22px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap;
}
header.kopf h1 { font-size: 16px; margin: 0; }
header.kopf .unterzeile { color: var(--gedaempft); font-size: 12.5px; }
header.kopf .werkzeuge { margin-left: auto; display: flex; gap: 8px; }

nav.reiter {
  background: #fff; border-bottom: 1px solid var(--linie);
  padding: 8px 22px 0; display: flex; gap: 4px; flex-wrap: wrap;
}
nav.reiter button {
  border: 1px solid transparent; border-bottom: none; background: none;
  padding: 8px 14px; font-size: 14px; cursor: pointer;
  color: var(--gedaempft); border-radius: 6px 6px 0 0;
}
nav.reiter button.aktiv {
  background: var(--hintergrund); color: var(--text);
  border-color: var(--linie); font-weight: 600;
}

main { padding: 18px 22px 60px; max-width: 1180px; margin: 0 auto; }

/* --- Bausteine ------------------------------------------------------------ */
.kacheln { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 16px; }
.kachel { background: #fff; border: 1px solid var(--linie); border-radius: 8px; padding: 11px 13px; }
.kachel .titel { color: var(--gedaempft); font-size: 12px; }
.kachel .wert { font-size: 19px; font-weight: 600; margin-top: 2px; }

.karte { background: #fff; border: 1px solid var(--linie); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
.karte h2 { font-size: 15px; margin: 0 0 10px; }

table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--linie); vertical-align: top; }
th { color: var(--gedaempft); font-weight: 600; font-size: 12.5px; }
td.r, th.r { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tr.summe td { font-weight: 600; border-top: 2px solid #999; }
tr.klickbar { cursor: pointer; }
tr.klickbar:hover { background: #eef3fa; }

.klein { color: var(--gedaempft); font-size: 11.5px; font-weight: normal; }
.grund { font-size: 12.5px; color: #2c3440; margin: 3px 0; max-width: 60em; }
.plus { color: var(--schlecht); }
.minus { color: var(--gut); }

button { font-family: inherit; }
button.knopf {
  border: 1px solid var(--linie); background: #fff; border-radius: 6px;
  padding: 6px 12px; cursor: pointer; font-size: 13px;
}
button.knopf:hover { background: #eef3fa; border-color: var(--akzent); }
button.knopf.haupt { background: var(--akzent); color: #fff; border-color: var(--akzent); }
button.knopf:disabled, button.knopf.haupt:disabled {
  background: #e9ecef; color: #9aa4b0; border-color: var(--linie); cursor: not-allowed;
}

.marke { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid; }
.marke.gut { color: var(--gut); border-color: var(--gut); }
.marke.schlecht { color: var(--schlecht); border-color: var(--schlecht); }
.marke.warnung { color: var(--warnung); border-color: var(--warnung); }

.befund { border-left: 3px solid var(--warnung); padding: 7px 12px; margin: 8px 0; background: #fffaf3; border-radius: 0 6px 6px 0; }
.befund.ok { border-color: var(--gut); background: #f2faf5; }
.befund.info { border-color: var(--akzent); background: #f3f7fd; }
.befund b { display: block; }

details summary { cursor: pointer; color: var(--akzent); font-size: 12.5px; }

/* --- Beleg erfassen ------------------------------------------------------- */
.ablage {
  border: 2px dashed var(--linie); border-radius: 8px; padding: 26px; text-align: center;
  color: var(--gedaempft); background: #fbfcfd;
}
.ablage.bereit { border-color: var(--akzent); background: #eef3fa; color: var(--akzent); }
textarea { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
  border: 1px solid var(--linie); border-radius: 6px; padding: 8px; margin: 8px 0; }
textarea.begruendungsfeld { width: 100%; margin-top: 6px; font-family: inherit; font-size: 13px; }
input.feld, select.feld {
  width: 100%; border: 1px solid var(--linie); border-radius: 5px; padding: 4px 7px;
  font-family: inherit; font-size: 13px; background: #fff;
}
input.feld:focus, select.feld:focus { outline: 2px solid var(--akzent); outline-offset: -1px; }
pre.dokumenttext {
  background: #f7f9fb; border: 1px solid var(--linie); border-radius: 6px; padding: 10px;
  font-size: 11.5px; max-height: 320px; overflow: auto; white-space: pre-wrap;
}

tr.ohne-zuordnung { background: #fffaf3; }
details.karte summary { cursor: pointer; font-size: 14px; color: var(--text); }
details.karte[open] summary { margin-bottom: 10px; }

/* --- Positionskarten beim Zuordnen --------------------------------------- */
.positionskopf { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.positionskopf button { margin-left: auto; }

.positionskarte {
  border: 1px solid var(--linie); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px;
  background: #fff;
}
.positionskarte.vorschlag { border-left: 4px solid var(--akzent); }
.positionskarte.erledigt { background: #f5f8f5; border-left: 4px solid var(--gut); padding: 8px 14px; }
.positionskarte .kopfzeile { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.positionskarte .kopfzeile .r { white-space: nowrap; font-variant-numeric: tabular-nums; }
.positionskarte .vorschlagszeile { margin: 8px 0 4px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.positionskarte .vorschlagszeile .klein { letter-spacing: .06em; }
/* Die Begründung ist der wichtigste Text der Karte - nicht grau und nicht klein. */
.positionskarte .grund { font-size: 14px; color: var(--text); margin: 6px 0; }
.positionskarte table.grundlagen { font-size: 12.5px; margin: 6px 0 10px; }
.positionskarte table.grundlagen td { border: none; padding: 1px 10px 1px 0; vertical-align: top; }
.positionskarte table.grundlagen td:first-child { color: var(--gedaempft); width: 9em; }
.positionskarte .entscheidung { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.positionskarte .entscheidung button { min-height: 36px; }
.positionskarte .selbst { border-top: 1px solid var(--linie); margin-top: 10px; padding-top: 10px; }
.positionskarte .selbst label { display: block; margin-bottom: 4px; }
button.klein-knopf { padding: 2px 8px; font-size: 12px; min-height: 0; margin-left: 8px; }

/* --- Einstellungen -------------------------------------------------------- */
.schalter { display: grid; grid-template-columns: 220px 1fr; gap: 10px 16px; align-items: start; }
.schalter label { font-weight: 600; }
/* Gilt überall, nicht nur im Reiter Einstellungen: Dieselben Knöpfe stehen
   auch beim Zuordnen einer Belegposition (umlagefähig / nicht umlagefähig).
   Dort erschienen sie vorher ungestaltet, und die getroffene Wahl war nicht
   zu erkennen. */
.auswahl { display: flex; gap: 6px; flex-wrap: wrap; }
.auswahl button {
  border: 1px solid var(--linie); background: #fff; border-radius: 6px;
  padding: 7px 12px; cursor: pointer; font-size: 13px; min-height: 34px;
}
.auswahl button:hover { border-color: var(--akzent); }
.auswahl button.aktiv { background: var(--akzent); color: #fff; border-color: var(--akzent); }

.speicherleiste {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  background: #fff8e6; border-bottom: 1px solid var(--warnung);
  padding: 10px 22px; font-size: 13px; color: #6b4708;
}
.speicherleiste b { display: block; }
.speicherleiste button { margin-left: auto; white-space: nowrap; }
.speicherleiste code { background: #f3e6c4; }

.buchungsformular {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px; align-items: end;
}
.buchungsformular label { font-size: 12px; color: var(--gedaempft); display: block; }
.buchungsformular input { margin-top: 3px; }

.diff { background: #fffdf5; border: 1px solid var(--warnung); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }

/* =============================================================================
 * DAS SCHREIBEN (Bildschirm: wie Papier; Druck: A4)
 * ========================================================================== */
.papier {
  background: var(--papier); border: 1px solid var(--linie); border-radius: 4px;
  padding: 18mm; margin: 0 auto 16px; max-width: 210mm;
}

.schreiben { font-size: 10.5pt; line-height: 1.4; }
.schreiben .briefkopf {
  display: flex; justify-content: space-between; font-size: 9pt;
  color: #444; border-bottom: 1px solid #999; padding-bottom: 6px; margin-bottom: 22px;
}
.schreiben .rechts { text-align: right; }
.schreiben .datumzeile { float: right; font-size: 9pt; text-align: right; }
.schreiben .anschriftenfeld { min-height: 32mm; }
.schreiben .absenderzeile { font-size: 7.5pt; color: #666; text-decoration: underline; margin-bottom: 8px; }
.schreiben h1 { font-size: 15pt; margin: 18px 0 4px; }
.schreiben .untertitel { color: #444; margin-bottom: 14px; }
.schreiben h2 {
  font-size: 11pt; margin: 18px 0 6px;
  /* Eine Überschrift allein am Seitenende, deren Inhalt erst auf der nächsten
     Seite folgt, wirkt im Druck wie ein Fehler - deshalb wandert sie mit. */
  page-break-after: avoid;
}
.schreiben h2 + p, .schreiben h2 + table { page-break-before: avoid; }
.schreiben p { margin: 6px 0; }
.schreiben .anrede { margin-top: 14px; }
.schreiben table.eckdaten td { border: none; padding: 2px 8px 2px 0; }
.schreiben table.eckdaten td:first-child { color: #555; width: 42mm; }
.schreiben table.kosten { margin: 10px 0; font-size: 9.5pt; }
.schreiben table.kosten th { background: #f2f2f2; border-bottom: 1px solid #999; color: #000; }
.schreiben table.kosten tr { page-break-inside: avoid; }
.schreiben table.kosten tr.summe td { border-top: 2px solid #333; border-bottom: none; }
.schreiben table.kosten tr.ergebnis td { font-weight: 700; font-size: 11pt; background: #f7f7f7; border-bottom: 2px solid #333; }
/* Eine IBAN darf nicht mitten im Block umbrechen - sonst steht "DE21" am
   Zeilenende und der Rest auf der nächsten Zeile. */
.schreiben .iban { white-space: nowrap; }
.schreiben .grund { font-size: 9pt; color: #333; margin: 2px 0 1px; }
.schreiben .hinweis { border: 1px solid var(--warnung); background: #fffaf3; padding: 8px 10px; margin: 10px 0; font-size: 9.5pt; }
.schreiben .entwurfsband {
  border: 2px solid var(--schlecht); background: #fdf2f2; color: var(--schlecht);
  padding: 8px 10px; margin-bottom: 14px; font-size: 9.5pt;
}
.schreiben .entwurfsband b { display: block; letter-spacing: 0.08em; }
.schreiben .offen { color: var(--schlecht); font-weight: 600; }
.schreiben .gruss { margin-top: 18px; }
/* Herleitung, Belegeinsicht und Grußformel gehören zusammen. Ohne diese Regel
   landet die Grußformel allein auf einer sonst leeren letzten Seite. */
.schreiben .abschluss { page-break-inside: avoid; }
.schreiben .brieffuss { font-size: 8pt; color: #666; border-top: 1px solid #999; margin-top: 22px; padding-top: 6px; }

/* Der Druckbereich ist am Bildschirm unsichtbar - er existiert nur fürs Papier. */
#druckbereich { display: none; }

/* =============================================================================
 * DRUCK
 * ========================================================================== */
@media print {
  @page { size: A4; margin: 18mm 18mm 16mm 18mm; }

  body { background: #fff; }
  header.kopf, nav.reiter, main { display: none !important; }

  #druckbereich { display: block; }
  #druckbereich .schreiben { page-break-after: always; }
  #druckbereich .schreiben:last-child { page-break-after: auto; }

  /* Wird ein einzelnes Schreiben gedruckt, blendet dieser Block alle anderen
     aus. body[data-nur-drucken] wird dafür in app.js gesetzt. */
  body[data-nur-drucken] #druckbereich .schreiben { display: none; }
  body[data-nur-drucken] #druckbereich .schreiben.drucken { display: block; }
}

  "befunde": [
    {
      "id": "A1",
      "kategorie": "Stammdaten",
      "titel": "Wohnfläche WE 3: 'ca. 81 m²' (Vertrag Nowak 2016) vs. 84,00 m² (Aufmaß 2018)",
      "behandlung": "84,00 m² angesetzt. Das Aufmaß vom 12.04.2018 ist lt. Einheitenübersicht maßgeblich, der Vertrag Kestner nennt bereits 84,00 m², und nach BGH (VIII ZR 220/17) zählt für die Betriebskostenumlage die tatsächliche Fläche. Abweichung 3,7 % – auch die 10 %-Toleranz-Rechtsprechung greift nicht.",
      "auswirkung": "Frau Nowak zahlt ihren Anteil nach 84 m² statt 81 m² (≈ +3,7 % auf ihren Anteil)."
    },
    {
      "id": "A2",
      "kategorie": "Zahlungseingang",
      "titel": "WE 4 Ohlwein: Mietzahlung Oktober 2025 fehlt auf dem Objektkonto",
      "behandlung": "Nur 11 Zahlungseingänge à 760,00 € (Okt. fehlt). In der Abrechnung werden nur die tatsächlich geleisteten Vorauszahlungen (11 × 150,00 € = 1.650,00 €) gutgeschrieben (BGH VIII ZR 57/04). Die offene Oktobermiete (760,00 €) ist außerhalb der Abrechnung als Mietrückstand anzumahnen.",
      "auswirkung": "Nachzahlung Ohlwein 325,43 € statt 175,43 € bei Soll-Ansatz; umschaltbar im Reiter Einstellungen (vorauszahlungen_ansatz)."
    },
    {
      "id": "A3",
      "kategorie": "Mietbuchhaltung",
      "titel": "WE 2 Bendel: Staffelmiete (§ 3a) nicht umgesetzt",
      "behandlung": "Für die Nebenkostenabrechnung irrelevant (Vorauszahlung 120 € ist von den Staffeln unberührt). Aber: Stammdaten 'laut Buchhaltung' zeigen 465 €, der Mieter zahlt 465 € – vertraglich geschuldet sind 515 € (ab 09/2024) bzw. 545 € (ab 09/2025). Mindereinnahme 2025: 720 € (belegt durch die Kontoauszüge). Hat er auch ab 09/2023 nur 465 € gezahlt, kommen bis zu 500 € hinzu – die Auszüge 2023/24 liegen nicht vor.",
      "auswirkung": "Kein Einfluss auf die Abrechnung; Bewirtschaftungs-Check Nr. 1."
    },
    {
      "id": "A4",
      "kategorie": "Kostenabgrenzung",
      "titel": "RheinEnergie-Jahresrechnung erst am 22.01.2026: 1.276,60 € Kosten vs. 1.200,00 € Abschläge in 2025",
      "behandlung": "Leistungsprinzip: angesetzt werden die Kosten des Abrechnungsjahres lt. Jahresrechnung (1.276,60 €), da die Rechnung vor Erstellung der Abrechnung vorliegt. Der Nachzahlungsbetrag (76,60 €) fließt im Februar 2026 ab. Umschaltbar (kostenansatz: abfluss).",
      "auswirkung": "+76,60 € umlagefähige Kosten gegenüber Abflussprinzip; umschaltbar im Reiter Einstellungen (kostenansatz)."
    },
    {
      "id": "A5",
      "kategorie": "Kostenabgrenzung",
      "titel": "Hauswart-Rechnungen enthalten 'Kleinreparaturen und Instandhaltungsarbeiten' (300,00 € in 2025)",
      "behandlung": "Position 2 jeder Wilms-Rechnung ist Instandhaltung (§ 2 Nr. 14 BetrKV nimmt Instandhaltung ausdrücklich aus) und wird herausgerechnet; nur die Hauswartpauschale (4 × 360,00 €) wird umgelegt.",
      "auswirkung": "300,00 € weniger Umlage als bei ungeprüfter Übernahme der Rechnungsbeträge."
    },
    {
      "id": "A6",
      "kategorie": "Kostenabgrenzung",
      "titel": "Vodafone Sammelinkasso Kabel-TV (427,20 €) nicht mehr umlagefähig",
      "behandlung": "Das 'Nebenkostenprivileg' für Kabel-TV endete zum 30.06.2024 (Wegfall des § 2 Nr. 15 BetrKV). Zudem ist Kabelanschluss in § 4 der Mietverträge nicht als Kostenart vereinbart. Nicht umgelegt.",
      "auswirkung": "Kosten verbleiben bei der Eigentümerin; Bewirtschaftungs-Check Nr. 3."
    },
    {
      "id": "A7",
      "kategorie": "Kostenabgrenzung",
      "titel": "Weitere nicht umlagefähige Belege: Verwaltervergütung (1.176 €), Neuanlage Vorgarten (1.480 €), Steigleitungsreparatur (486,20 €), Rechtsschutz (189 €)",
      "behandlung": "Verwaltung: § 1 Abs. 2 Nr. 1 BetrKV. Neuanlage: einmalige Herstellung, keine laufende Gartenpflege (eigenes Konto 6600). Steigleitung: Instandsetzung. Rechtsschutz: keine Sach-/Haftpflichtversicherung. Alle vier bleiben beim Eigentümer, werden in den Abrechnungen aber zur Transparenz als 'nicht umgelegt' ausgewiesen.",
      "auswirkung": "Von 12.956,72 € Belegsumme sind 8.898,32 € (68,7 %) umlagefähig."
    },
    {
      "id": "A8",
      "kategorie": "Plausibilität",
      "titel": "Hauswart Q1 rechnet 'Kontrolle Heizungsraum' ab – das Haus hat keinen Heizungsraum",
      "behandlung": "Alle vier Wohnungen haben Gas-Etagenthermen. Vermutlich Textbaustein aus einem anderen Objekt. Der Pauschalbetrag wird dennoch angesetzt (Vertrag vom 04.01.2021), die Leistungsbeschreibung ist aber zu klären.",
      "auswirkung": "Rückfrage an Eigentümerin/Hauswart; kein Zahleneffekt."
    },
    {
      "id": "A9",
      "kategorie": "Plausibilität",
      "titel": "Wasserverbrauch 320 m³ konsistent (RheinEnergie ↔ Schmutzwassergebühr Stadt Köln); Saldenkette der 12 Kontoauszüge lückenlos; alle 23 Belege vollständig bezahlt",
      "behandlung": "Automatisch geprüft (Prüfungen I-04, I-06, P-01 im Rechenkern; Belegsummen zusätzlich gegen den PDF-Text über scripts/02_parse.py). 320 m³ / 250 m² ≈ 1,28 m³/m² bzw. ≈ 80 m³ je Wohnung – plausibel.",
      "auswirkung": "Keine."
    },
    {
      "id": "A10",
      "kategorie": "Vertrag",
      "titel": "Anschrift Frau Nowak nach Auszug unbekannt",
      "behandlung": "Das Schreiben an Frau Nowak ist gesperrt: Prüfung F-08 schlägt an, das Dokument trägt sichtbar den Vermerk ENTWURF und darf nicht versandt werden. Sobald die Anschrift eingetragen ist, verschwindet der Vermerk. Frist § 556 Abs. 3 BGB: 31.12.2026.",
      "auswirkung": "Rückfrage."
    },
    {
      "id": "A11",
      "kategorie": "Plausibilität",
      "titel": "Hauswart rechnet konkrete Reparaturen am ersten Tag des Quartals ab",
      "behandlung": "Jede der vier Wilms-Rechnungen ist auf den ersten Tag ihres Leistungszeitraums datiert (02.01., 01.04., 01.07., 01.10.) und listet trotzdem einzelne Arbeiten „nach Aufwand“ für dieses Quartal – etwa „Austausch 3 Leuchtmittel Treppenhaus“ am 02.01. für den Zeitraum bis 31.03. Zum Rechnungsdatum können diese Arbeiten nicht erbracht gewesen sein. Die Positionen sind ohnehin nicht umlagefähig und wurden herausgerechnet; die Pauschale von 4 × 360 € bleibt angesetzt, weil ein Hauswartvertrag vorliegt.",
      "auswirkung": "Kein Zahleneffekt. Aber: Wer Leistungen im Voraus bezahlt, die nicht nachweisbar erbracht sind, legt sie auch nicht rechtssicher um. Leistungsnachweise anfordern – Rückfrage 6."
    },
    {
      "id": "A12",
      "kategorie": "Vertrag",
      "titel": "Neuvertrag Kestner: 890 € für 84 m² (10,60 €/m²) nach zuvor 700 €",
      "behandlung": "Die Miete stieg bei der Neuvermietung um 27 %. Köln unterliegt der Mietpreisbegrenzungsverordnung NRW. Der Mietvertrag nennt lediglich „vor Übergabe instandgesetzt und neu gestrichen“ – das ist Instandsetzung, keine umfassende Modernisierung, die eine Ausnahme begründen würde. Ohne Kenntnis der ortsüblichen Vergleichsmiete lässt sich das nicht abschließend beurteilen.",
      "auswirkung": "Kein Einfluss auf die Nebenkostenabrechnung. Aber ein Rückforderungsrisiko für die Eigentümerin – Rückfrage 10. Die Ausnahme für die Vormiete (§ 556e BGB) greift hier nicht, weil die Vormiete niedriger war."
    },
    {
      "id": "A13",
      "kategorie": "Plausibilität",
      "titel": "Kleine Unstimmigkeiten in zwei Belegen und einem Zahlungseingang",
      "behandlung": "Die Verwalterrechnung rechnet 12 WE-Monate × 20,59 € = 247,06 €; tatsächlich ergibt das 247,08 €. Der Nettowert wurde offenbar aus dem Bruttobetrag von 294 € zurückgerechnet. Ohne Folge, da Verwaltungskosten nicht umlagefähig sind. Herr Kestner zahlte die Septembermiete am 12.09. statt bis zum dritten Werktag.",
      "auswirkung": "Kein Zahleneffekt auf die Abrechnung. Beides in der Buchhaltung im Blick behalten."
    }

  <script>
/* =============================================================================
 * RECHENKERN DER NEBENKOSTENABRECHNUNG
 * =============================================================================
 *
 * WAS DIESE DATEI IST
 *   Die gesamte Rechen- und Prüflogik der Abrechnung - in einer Datei, damit man
 *   sie am Stück lesen kann. Sie bekommt einen "Fall" (daten/fall_2025.json) und
 *   gibt ein "Ergebnis" zurück. Mehr macht sie nicht.
 *
 * WAS SIE BEWUSST NICHT TUT
 *   - Sie liest und schreibt keine Dateien.
 *   - Sie erzeugt kein HTML und kein PDF.
 *   - Sie kennt keinen Browser und kein Node.
 *   Dadurch kann derselbe Code im Browser (Oberfläche) und in Node (Tests)
 *   laufen, und es gibt nur EINE Rechenlogik - keine zweite, die abweichen kann.
 *
 * AUFBAU
 *   TEIL 1  Geld: Rechnen in ganzen Cent und centgenaues Verteilen
 *   TEIL 2  Zeit: Tage, Monate, Zeitanteile
 *   TEIL 3  Die Berechnung
 *   TEIL 4  Die Prüfungen (Katalog aus SPEC.md)
 *   TEIL 5  Export
 *
 * GRUNDREGEL DES GANZEN SYSTEMS
 *   Intern wird ausschließlich in GANZEN CENT gerechnet (also 442,00 EUR = 44200).
 *   Grund: Kommazahlen sind im Computer nicht exakt (0.1 + 0.2 ergibt 0.30000000000000004).
 *   Bei Geld führt das früher oder später zu Cent-Differenzen. Ganze Zahlen sind
 *   exakt. Erst bei der Anzeige wird wieder in Euro umgerechnet.
 * ========================================================================== */

(function (global) {
  "use strict";

  /* ===========================================================================
   * TEIL 1 - GELD
   * ========================================================================= */

  /** Euro (z. B. 442.00) -> ganze Cent (44200). */
  function zuCent(euro) {
    return Math.round(euro * 100);
  }

  /** Ganze Cent (44200) -> Euro als Zahl (442). Nur für Anzeige/Export. */
  function zuEuro(cent) {
    return cent / 100;
  }

  /** Ganze Cent -> deutscher Text, z. B. 44200 -> "442,00 EUR". */
  function alsEuroText(cent) {
    const text = Math.abs(cent / 100).toLocaleString("de-DE", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    });
    return (cent < 0 ? "−" : "") + text + " €";
  }

  /** "2025-08-01" -> "01.08.2025". Für Anzeige und Schreiben. */
  function alsDatumText(iso) {
    const [jahr, monat, tag] = iso.split("-");
    return `${tag}.${monat}.${jahr}`;
  }

  /** 0.248 -> "24,800 %". Nachkommastellen einstellbar. */
  function alsProzentText(anteil, nachkommastellen = 3) {
    return (
      (anteil * 100).toLocaleString("de-DE", {
        minimumFractionDigits: nachkommastellen,
        maximumFractionDigits: nachkommastellen,
      }) + " %"
    );
  }

  /** 62 -> "62,00". Für Quadratmeterangaben. */
  function alsZahlText(zahl, nachkommastellen = 2) {
    return zahl.toLocaleString("de-DE", {
      minimumFractionDigits: nachkommastellen,
      maximumFractionDigits: nachkommastellen,
    });
  }

  /**
   * VERTEILT EINEN BETRAG CENTGENAU (Largest-Remainder-Verfahren)
   * ---------------------------------------------------------------------------
   * Das Problem: 1.096,00 EUR sollen nach Wohnfläche auf vier Wohnungen verteilt
   * werden. Die exakten Anteile sind 271,808 / 212,624 / 368,256 / 243,312 EUR.
   * Rundet man jeden Wert einzeln kaufmännisch, ergibt die Summe der gerundeten
   * Werte nicht mehr exakt 1.096,00 EUR - es fehlen oder es entstehen Cent.
   * Genau dieser Fehler steckte in v1 (siehe SPEC.md § 9.2: 2 Cent Differenz).
   *
   * Die Lösung (Largest Remainder / Hare-Niemeyer, dasselbe Verfahren wie bei
   * Sitzverteilungen):
   *   1. Jeden Anteil exakt berechnen und ABRUNDEN.
   *   2. Es bleibt ein Rest von wenigen Cent übrig (Gesamt minus Summe der
   *      abgerundeten Werte).
   *   3. Diese Rest-Cent bekommen die Anteile mit dem GRÖSSTEN abgeschnittenen
   *      Nachkommateil - einer je Cent.
   * Ergebnis: Die Summe stimmt danach immer exakt, und jeder Anteil weicht um
   * höchstens einen Cent vom mathematisch exakten Wert ab.
   *
   * @param {number}   gesamtCent  zu verteilender Betrag in ganzen Cent (>= 0)
   * @param {number[]} gewichte    z. B. Wohnflächen oder Nutzungstage
   * @returns {number[]}           Anteile in ganzen Cent, Summe == gesamtCent
   */
  function verteileCentgenau(gesamtCent, gewichte) {
    const summeGewichte = gewichte.reduce((a, b) => a + b, 0);

    // Ohne Gewichte kann nichts verteilt werden (z. B. Einheit ohne Mieter).
    if (summeGewichte <= 0) return gewichte.map(() => 0);

    // Schritt 1: exakter Anteil und daraus der abgerundete Wert.
    const exakt = gewichte.map((g) => (gesamtCent * g) / summeGewichte);
    const anteile = exakt.map((wert) => Math.floor(wert));

    // Schritt 2: wie viele Cent sind durch das Abrunden übrig geblieben?
    let restCent = gesamtCent - anteile.reduce((a, b) => a + b, 0);

    // Schritt 3: Rest-Cent nach Größe des abgeschnittenen Nachkommateils vergeben.
    // Bei exaktem Gleichstand entscheidet die ursprüngliche Reihenfolge
    // (JavaScript sortiert stabil) - damit ist das Ergebnis reproduzierbar.
    const nachRestSortiert = exakt
      .map((wert, index) => ({ index, nachkomma: wert - Math.floor(wert) }))
      .sort((a, b) => b.nachkomma - a.nachkomma);

    for (let i = 0; i < restCent; i++) {
      anteile[nachRestSortiert[i % nachRestSortiert.length].index] += 1;
    }
    return anteile;
  }

  /* ===========================================================================
   * TEIL 2 - ZEIT
   * ========================================================================= */

  /** "2025-08-01" -> Date. Immer UTC, damit Sommerzeit nichts verschiebt. */
  function alsDatum(iso) {
    return new Date(iso + "T00:00:00Z");
  }

  /** Anzahl Tage von..bis, beide Tage mitgezählt. 01.01.-31.12.2025 = 365. */
  function tageZwischen(vonIso, bisIso) {
    const EIN_TAG = 24 * 60 * 60 * 1000;
    return Math.round((alsDatum(bisIso) - alsDatum(vonIso)) / EIN_TAG) + 1;
  }

  /** Angefangene Kalendermonate, beide mitgezählt. Januar..Juli = 7. */
  function monateZwischen(vonIso, bisIso) {
    const a = alsDatum(vonIso);
    const b = alsDatum(bisIso);
    return (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + (b.getUTCMonth() - a.getUTCMonth()) + 1;
  }

  /** Das spätere von zwei Daten (als ISO-Text). */
  const spaeteres = (a, b) => (a > b ? a : b);
  /** Das frühere von zwei Daten (als ISO-Text). */
  const frueheres = (a, b) => (a < b ? a : b);

  /* ===========================================================================
   * TEIL 3 - DIE BERECHNUNG
   * ===========================================================================
   *
   * Der Rechenweg in einem Satz:
   *
   *   Anteil = Gesamtkosten der Kostenart
   *            x  Wohnfläche der Einheit / Gesamtwohnfläche
   *            x  Nutzungstage des Mietverhältnisses / Tage im Abrechnungsjahr
   *
   * Umgesetzt wird das in ZWEI Verteilschritten, beide centgenau:
   *   Schritt A: Kostenart  ->  die vier Einheiten   (Gewicht: Wohnfläche)
   *   Schritt B: Einheit    ->  ihre Mietverhältnisse (Gewicht: Nutzungstage)
   *
   * Warum zwei Schritte und nicht eine Multiplikation? Weil so per Konstruktion
   * gilt: Summe aller Mieteranteile == Gesamtkosten, auf den Cent. Die Prüfungen
   * A-02/A-03/F-09 können danach gar nicht mehr fehlschlagen.
   * ========================================================================= */

  function berechne(fall) {
    const zeitraumVon = fall.abrechnung.von;
    const zeitraumBis = fall.abrechnung.bis;
    const tageImJahr = tageZwischen(zeitraumVon, zeitraumBis);
    const einstellungen = fall.einstellungen;

    // -----------------------------------------------------------------------
    // 3.1  Mietverhältnisse vorbereiten: Wie lange war wer im Jahr Mieter?
    // -----------------------------------------------------------------------
    const mietverhaeltnisse = fall.mietverhaeltnisse.map((m) => {
      // Ein Mietverhältnis kann vor dem Jahr begonnen und nach ihm geendet haben.
      // Uns interessiert nur der Teil, der IM Abrechnungszeitraum liegt.
      const nutzungVon = spaeteres(m.beginn, zeitraumVon);
      const nutzungBis = frueheres(m.ende || zeitraumBis, zeitraumBis);

      const tage = tageZwischen(nutzungVon, nutzungBis);
      const monate = monateZwischen(nutzungVon, nutzungBis);

      // Das Gewicht für Schritt B. "tage" ist der Normalfall (taggenau),
      // "monate" die Alternative aus den Einstellungen.
      const gewicht = einstellungen.zeitanteil_methode === "monate" ? monate : tage;

      return {
        ...m,
        nutzung_von: nutzungVon,
        nutzung_bis: nutzungBis,
        tage,
        monate,
        gewicht,
        ganzjahr: tage === tageImJahr,
        zeit_text:
          einstellungen.zeitanteil_methode === "monate"
            ? `${monate}/12 Monate`
            : `${tage}/${tageImJahr} Tage`,
        zeilen: [],       // wird in 3.3 gefüllt
        summe_cent: 0,    // ebenso
      };
    });

    // -----------------------------------------------------------------------
    // 3.2  Kosten je Kostenart aus den Belegen zusammenzählen
    // -----------------------------------------------------------------------
    const kostenarten = [];
    for (const [schluessel, stamm] of Object.entries(fall.kostenarten)) {
      kostenarten.push({
        schluessel,
        bezeichnung: stamm.bezeichnung,
        betrkv: stamm.betrkv,           // Rechtsgrundlage (Betriebskostenverordnung)
        vertrag: stamm.vertrag || "",   // Vertragsgrundlage (§ 4 des Mietvertrags)
        warum: stamm.warum || "",       // dieselbe Aussage in normaler Sprache
        konto: stamm.konto,
        umlagefaehig_bis: stamm.umlagefaehig_bis || null,
        gesamt_cent: 0,
        positionen: [],
        umlagefaehig: stamm.umlagefaehig,
      });
    }
    const kostenartNach = {};
    kostenarten.forEach((k) => (kostenartNach[k.schluessel] = k));

    for (const beleg of fall.belege) {
      // Beim Abflussprinzip zählt nicht der Rechnungsbetrag, sondern was im
      // Abrechnungsjahr tatsächlich vom Konto abgeflossen ist. Betroffen ist hier
      // nur die RheinEnergie-Jahresrechnung (Rechnung 2026, Abschläge 2025).
      const abflussAbweichend =
        einstellungen.kostenansatz === "abfluss" && typeof beleg.abfluss_im_abrechnungsjahr === "number";

      for (const position of beleg.positionen) {
        let betragCent = zuCent(position.betrag);
        if (abflussAbweichend) {
          betragCent = Math.round(
            (betragCent * zuCent(beleg.abfluss_im_abrechnungsjahr)) / zuCent(beleg.rechnungsbetrag)
          );
        }

        const kostenart = kostenartNach[position.kostenart];
        kostenart.gesamt_cent += betragCent;
        kostenart.positionen.push({
          beleg: beleg.beleg,
          lieferant: beleg.lieferant,
          datum: beleg.datum,
          leistungszeitraum: beleg.leistungszeitraum,
          bezeichnung: position.bezeichnung,
          betrag_cent: betragCent,
          umlagefaehig: position.umlagefaehig,
          begruendung: position.begruendung || "",
        });
      }
    }

    // Eine Kostenart gilt als umlagefähig, wenn ALLE ihre Positionen es sind.
    // Maßgeblich ist immer die Position, nicht die Kostenart - so kann eine
    // Hauswartrechnung teils umlagefähig, teils Instandhaltung sein.
    for (const k of kostenarten) {
      if (k.positionen.length > 0) {
        k.umlagefaehig = k.positionen.every((p) => p.umlagefaehig);
      }
    }

    const benutzteKostenarten = kostenarten.filter((k) => k.positionen.length > 0);
    const umlagefaehige = benutzteKostenarten.filter((k) => k.umlagefaehig);
    const nichtUmlagefaehige = benutzteKostenarten.filter((k) => !k.umlagefaehig);

    // -----------------------------------------------------------------------
    // 3.3  Verteilen: Kostenart -> Einheiten -> Mietverhältnisse
    // -----------------------------------------------------------------------
    // Gewicht für Schritt A: die Wohnfläche. Wir nehmen sie mal 100 als ganze
    // Zahl (62,00 m² -> 6200), damit auch hier keine Kommazahlen mitrechnen.
    const einheiten = fall.einheiten.map((e) => ({
      ...e,
      flaeche_gewicht: Math.round(e.wohnflaeche_qm * 100),
      jahresanteil_cent: 0,
    }));
    const flaecheGesamt = einheiten.reduce((summe, e) => summe + e.wohnflaeche_qm, 0);

    for (const kostenart of umlagefaehige) {
      // --- Schritt A: Gesamtkosten auf die Einheiten -----------------------
      const anteileJeEinheit = verteileCentgenau(
        kostenart.gesamt_cent,
        einheiten.map((e) => e.flaeche_gewicht)
      );
      kostenart.anteile_je_einheit = {};

      einheiten.forEach((einheit, i) => {
        const einheitAnteilCent = anteileJeEinheit[i];
        kostenart.anteile_je_einheit[einheit.we] = einheitAnteilCent;
        einheit.jahresanteil_cent += einheitAnteilCent;

        // --- Schritt B: Anteil der Einheit auf ihre Mietverhältnisse -------
        const mieterDieserEinheit = mietverhaeltnisse.filter((m) => m.we === einheit.we);
        const anteileJeMieter = verteileCentgenau(
          einheitAnteilCent,
          mieterDieserEinheit.map((m) => m.gewicht)
        );

        mieterDieserEinheit.forEach((mietverhaeltnis, j) => {
          mietverhaeltnis.zeilen.push({
            kostenart: kostenart.schluessel,
            bezeichnung: kostenart.bezeichnung,
            betrkv: kostenart.betrkv,
            gesamt_cent: kostenart.gesamt_cent,
            anteil_einheit_jahr_cent: einheitAnteilCent,
            betrag_cent: anteileJeMieter[j],
          });
          mietverhaeltnis.summe_cent += anteileJeMieter[j];
        });
      });
    }

    // -----------------------------------------------------------------------
    // 3.4  Vorauszahlungen und Ergebnis je Mietverhältnis
    // -----------------------------------------------------------------------
    for (const m of mietverhaeltnisse) {
      const vorauszahlungMonatlichCent = zuCent(m.nk_vorauszahlung);
      const nettokaltmieteCent = zuCent(m.nettokaltmiete);
      const gesamtmieteCent = nettokaltmieteCent + vorauszahlungMonatlichCent;

      // SOLL: was laut Vertrag zu zahlen gewesen wäre.
      m.vorauszahlung_soll_cent = vorauszahlungMonatlichCent * m.monate;

      // IST: was laut Kontoauszug tatsächlich eingegangen ist.
      // Zuordnung über die "zahler_kennung" (z. B. "OHLWEIN") im Buchungstext.
      m.zahlungen = fall.buchungen
        .filter(
          (b) =>
            b.betrag > 0 &&
            b.gegenpartei.toUpperCase().includes(m.zahler_kennung) &&
            b.datum >= m.nutzung_von &&
            b.datum <= m.nutzung_bis
        )
        .map((b) => {
          const betragCent = zuCent(b.betrag);
          // Bei voller Miete steckt genau die vertragliche Vorauszahlung darin.
          // Bei einer Teilzahlung wird der Rest nach Abzug der Kaltmiete als
          // Vorauszahlung gewertet (nie negativ).
          const vorauszahlungsanteilCent =
            betragCent >= gesamtmieteCent
              ? vorauszahlungMonatlichCent
              : Math.max(0, betragCent - nettokaltmieteCent);
          return {
            datum: b.datum,
            zweck: b.zweck,
            betrag_cent: betragCent,
            vorauszahlungsanteil_cent: vorauszahlungsanteilCent,
          };
        });

      m.vorauszahlung_ist_cent = m.zahlungen.reduce(
        (summe, z) => summe + z.vorauszahlungsanteil_cent,
        0
      );
      m.vorauszahlung_monatlich_cent = vorauszahlungMonatlichCent;
      m.fehlende_zahlungen = m.monate - m.zahlungen.length;

      // Welcher der beiden Werte angerechnet wird, steht in den Einstellungen.
      // Voreinstellung ist "ist" - nur tatsächlich geleistete Vorauszahlungen
      // dürfen angerechnet werden (BGH VIII ZR 57/04).
      m.vorauszahlung_angesetzt_cent =
        einstellungen.vorauszahlungen_ansatz === "soll"
          ? m.vorauszahlung_soll_cent
          : m.vorauszahlung_ist_cent;

      // Positiver Saldo = Nachzahlung des Mieters, negativer = Guthaben.
      m.saldo_cent = m.summe_cent - m.vorauszahlung_angesetzt_cent;
      m.ergebnis = m.saldo_cent > 0 ? "Nachzahlung" : m.saldo_cent < 0 ? "Guthaben" : "ausgeglichen";

      // Flächenanteil nur zur Anzeige im Schreiben.
      const einheit = einheiten.find((e) => e.we === m.we);
      m.lage = einheit.lage;                 // z. B. "Erdgeschoss links" - steht im Schreiben
      m.hinweis = einheit.hinweis || "";     // z. B. abweichende Flächenangabe im Altvertrag
      m.wohnflaeche_qm = einheit.wohnflaeche_qm;
      m.flaechen_anteil = einheit.wohnflaeche_qm / flaecheGesamt;
      m.jahresanteil_einheit_cent = einheit.jahresanteil_cent;

      // Vorschlag für die künftige Vorauszahlung (§ 560 Abs. 4 BGB):
      // Jahresbetrag der Wohnung durch 12, aufgerundet auf volle Euro.
      m.empfohlene_vorauszahlung_cent = Math.ceil(einheit.jahresanteil_cent / 12 / 100) * 100;
    }

    // -----------------------------------------------------------------------
    // 3.5  Summen fürs Gesamtbild
    // -----------------------------------------------------------------------
    const summeUmlagefaehigCent = umlagefaehige.reduce((s, k) => s + k.gesamt_cent, 0);
    const summeNichtUmlagefaehigCent = nichtUmlagefaehige.reduce((s, k) => s + k.gesamt_cent, 0);

    const ergebnis = {
      fall_bezeichnung: fall.bezeichnung,
      objekt: fall.objekt,
      vermieterin: fall.vermieterin,
      abrechnung: fall.abrechnung,
      einstellungen,
      tage_im_jahr: tageImJahr,
      flaeche_gesamt_qm: flaecheGesamt,
      einheiten,
      kostenarten: benutzteKostenarten,
      umlagefaehige,
      nicht_umlagefaehige: nichtUmlagefaehige,
      mietverhaeltnisse,
      summe_umlagefaehig_cent: summeUmlagefaehigCent,
      summe_nicht_umlagefaehig_cent: summeNichtUmlagefaehigCent,
      summe_belege_cent: benutzteKostenarten.reduce((s, k) => s + k.gesamt_cent, 0),
      kosten_je_qm_jahr_cent: Math.round(summeUmlagefaehigCent / flaecheGesamt),
      befunde: fall.befunde || [],
    };

    // Die Prüfungen laufen IMMER mit - man kann kein Ergebnis bekommen, ohne zu
    // wissen, ob es geprüft wurde (SPEC.md § 5.1, "fail-closed").
    ergebnis.pruefungen = pruefeAlles(fall, ergebnis);
    ergebnis.blocker = ergebnis.pruefungen.filter((p) => !p.bestanden && p.schwere === "blocker");
    ergebnis.warnungen = ergebnis.pruefungen.filter((p) => !p.bestanden && p.schwere === "warnung");
    ergebnis.freigegeben = ergebnis.blocker.length === 0;

    return ergebnis;
  }

  /* ===========================================================================
   * TEIL 4 - DIE PRÜFUNGEN
   * ===========================================================================
   *
   * Jede Prüfung hat eine feste Nummer aus SPEC.md, damit man von einem Befund
   * im Prüfprotokoll direkt zur Begründung in der Spezifikation kommt.
   *
   *   schwere "blocker" -> es werden KEINE Abrechnungen erzeugt
   *   schwere "warnung" -> Abrechnung entsteht, muss aber in den Annahmen stehen
   *   schwere "info"    -> reine Beobachtung
   * ========================================================================= */

  /** Kleiner Helfer, damit jede Prüfung gleich aussieht. */
  function pruefung(id, titel, schwere, bestanden, befund) {
    return { id, titel, schwere, bestanden, befund };
  }

  function pruefeAlles(fall, e) {
    const p = [];
    const euro = alsEuroText;

    /* --- L0: Stimmen die Daten mit den Belegen überein? -------------------- */

    // I-04: Die Positionen eines Belegs müssen seine Rechnungssumme ergeben.
    const belegeMitSummenfehler = fall.belege.filter((b) => {
      const summePositionen = b.positionen.reduce((s, pos) => s + zuCent(pos.betrag), 0);
      return summePositionen !== zuCent(b.rechnungsbetrag);
    });
    p.push(
      pruefung("I-04", "Positionen ergeben die Belegsumme", "blocker",
        belegeMitSummenfehler.length === 0,
        belegeMitSummenfehler.length === 0
          ? `${fall.belege.length} Belege geprüft`
          : belegeMitSummenfehler.map((b) => b.beleg).join(", "))
    );

    // I-06 (schließt I-05 ein): Saldenkette der Kontoauszüge. Je Monat muss
    // Anfangsbestand + Buchungen den Endbestand ergeben (das ist I-05), und der
    // Endbestand eines Monats muss der Anfangsbestand des nächsten sein (I-06).
    // Beides in einer Schleife zu prüfen ist klarer als zwei getrennte Läufe.
    const kettenfehler = [];
    const auszuege = (fall.kontoauszuege || []).slice().sort((a, b) => a.monat - b.monat);
    auszuege.forEach((auszug, i) => {
      const monatsText = String(auszug.monat).padStart(2, "0");
      const buchungenDesMonats = fall.buchungen.filter(
        (b) => b.datum.slice(0, 7) === `${auszug.jahr}-${monatsText}`
      );
      const summe = buchungenDesMonats.reduce((s, b) => s + zuCent(b.betrag), 0);
      if (zuCent(auszug.anfangsbestand) + summe !== zuCent(auszug.endbestand)) {
        kettenfehler.push(`${auszug.datei}: Saldo passt nicht zu den Buchungen`);
      }
      if (i > 0 && zuCent(auszuege[i - 1].endbestand) !== zuCent(auszug.anfangsbestand)) {
        kettenfehler.push(`${auszug.datei}: Anfangsbestand != Endbestand des Vormonats`);
      }
    });
    p.push(
      pruefung("I-06", "Saldenkette der Kontoauszüge lückenlos", "blocker",
        kettenfehler.length === 0,
        kettenfehler.length === 0
          ? `${auszuege.length} Auszüge, ${fall.buchungen.length} Buchungen`
          : kettenfehler.join(" | "))
    );

    // I-07: Derselbe Beleg zweimal erfasst?
    const gesehen = new Map();
    const dubletten = [];
    for (const b of fall.belege) {
      const schluessel = `${b.lieferant}|${b.rechnungsbetrag}|${b.datum}`;
      if (gesehen.has(schluessel)) dubletten.push(`${b.beleg} ~ ${gesehen.get(schluessel)}`);
      gesehen.set(schluessel, b.beleg);
    }
    p.push(
      pruefung("I-07", "Keine doppelt erfassten Belege", "warnung",
        dubletten.length === 0, dubletten.join(", ") || "keine Dubletten")
    );

    // I-12: Datumslogik der Belege.
    const datumsfehler = fall.belege.filter((b) => b.datum > "2027-01-01" || !b.datum);
    p.push(
      pruefung("I-12", "Belegdaten plausibel", "blocker",
        datumsfehler.length === 0, datumsfehler.map((b) => b.beleg).join(", ") || "alle plausibel")
    );

    /* --- L1: Stimmt die Arithmetik? --------------------------------------- */

    // A-01: Die Wohnflächen müssen die Gesamtwohnfläche ergeben.
    const flaecheLautStammdaten = fall.objekt.wohnflaeche_gesamt_qm;
    const flaecheSumme = e.flaeche_gesamt_qm;
    p.push(
      pruefung("A-01", "Summe der Wohnflächen == Gesamtwohnfläche", "blocker",
        Math.abs(flaecheSumme - flaecheLautStammdaten) < 0.005,
        `${flaecheSumme.toFixed(2)} m² vs. ${flaecheLautStammdaten.toFixed(2)} m² laut Stammdaten`)
    );

    // A-02: Je Kostenart muss die Summe der Einheitenanteile exakt die
    // Gesamtkosten ergeben. Das ist die Prüfung, die in v1 fehlgeschlagen wäre.
    const verteilfehler = e.umlagefaehige.filter((k) => {
      const summe = Object.values(k.anteile_je_einheit).reduce((a, b) => a + b, 0);
      return summe !== k.gesamt_cent;
    });
    p.push(
      pruefung("A-02", "Verteilung je Kostenart centgenau", "blocker",
        verteilfehler.length === 0,
        verteilfehler.map((k) => k.bezeichnung).join(", ") ||
          `${e.umlagefaehige.length} Kostenarten, Differenz 0 Cent`)
    );

    // A-03: Je Einheit müssen sich die Mietverhältnisse lückenlos und
    // überschneidungsfrei über das Jahr verteilen - sonst zahlt jemand doppelt
    // oder ein Zeitraum fällt unter den Tisch.
    const zeitfehler = [];
    for (const einheit of e.einheiten) {
      const mieter = e.mietverhaeltnisse
        .filter((m) => m.we === einheit.we)
        .sort((a, b) => a.nutzung_von.localeCompare(b.nutzung_von));
      const summeTage = mieter.reduce((s, m) => s + m.tage, 0);
      if (summeTage !== e.tage_im_jahr) {
        zeitfehler.push(`${einheit.we}: ${summeTage} statt ${e.tage_im_jahr} Tage belegt`);
      }
      for (let i = 1; i < mieter.length; i++) {
        if (mieter[i].nutzung_von <= mieter[i - 1].nutzung_bis) {
          zeitfehler.push(`${einheit.we}: Zeiträume überschneiden sich`);
        }
      }
      // Summe der verteilten Anteile muss den Jahresanteil der Einheit ergeben.
      const summeAnteile = mieter.reduce((s, m) => s + m.summe_cent, 0);
      if (summeAnteile !== einheit.jahresanteil_cent) {
        zeitfehler.push(`${einheit.we}: Anteile der Mieter != Jahresanteil der Einheit`);
      }
    }
    p.push(
      pruefung("A-03", "Zeitanteile je Einheit vollständig und überschneidungsfrei", "blocker",
        zeitfehler.length === 0, zeitfehler.join(" | ") || "alle 4 Einheiten ganzjährig belegt")
    );

    // A-04: Nichts darf beim Sortieren verloren gehen.
    const summeAllerPositionen = fall.belege.reduce(
      (s, b) => s + b.positionen.reduce((s2, pos) => s2 + zuCent(pos.betrag), 0), 0);
    const summeSortiert = e.summe_umlagefaehig_cent + e.summe_nicht_umlagefaehig_cent;
    const abflussAktiv = e.einstellungen.kostenansatz === "abfluss";
    p.push(
      pruefung("A-04", "umlagefähig + nicht umlagefähig == alle Belegpositionen", "blocker",
        abflussAktiv || summeSortiert === summeAllerPositionen,
        abflussAktiv
          ? "übersprungen: Abflussprinzip aktiv, Belegsummen weichen bewusst ab"
          : `${euro(summeSortiert)} == ${euro(summeAllerPositionen)}`)
    );

    // A-05: Saldo == Anteil minus angerechnete Vorauszahlung.
    const saldofehler = e.mietverhaeltnisse.filter(
      (m) => m.saldo_cent !== m.summe_cent - m.vorauszahlung_angesetzt_cent);
    p.push(
      pruefung("A-05", "Saldo == Anteil - Vorauszahlungen", "blocker",
        saldofehler.length === 0, saldofehler.map((m) => m.id).join(", ") || "5 Mietverhältnisse")
    );

    // A-06: Beim Ist-Ansatz muss die angerechnete Summe den erfassten
    // Zahlungseingängen entsprechen - kein frei gewählter Wert.
    const vzFehler = e.mietverhaeltnisse.filter((m) => {
      const erwartet = e.einstellungen.vorauszahlungen_ansatz === "soll"
        ? m.vorauszahlung_soll_cent : m.vorauszahlung_ist_cent;
      return m.vorauszahlung_angesetzt_cent !== erwartet;
    });
    p.push(
      pruefung("A-06", "Angerechnete Vorauszahlungen == erfasste Zahlungen", "blocker",
        vzFehler.length === 0,
        vzFehler.map((m) => m.id).join(", ") ||
          `Ansatz "${e.einstellungen.vorauszahlungen_ansatz}"`)
    );

    /* --- L2: Recht und Vertrag -------------------------------------------- */

    // R-01: Eine Kostenart darf nur umgelegt werden, wenn sie im § 4 DIESES
    // Mietvertrags steht. Der Katalog liegt als Daten am Mietverhältnis.
    const nichtVereinbart = [];
    for (const m of e.mietverhaeltnisse) {
      const katalog = m.vereinbarte_kostenarten || [];
      for (const zeile of m.zeilen) {
        if (zeile.betrag_cent > 0 && !katalog.includes(zeile.kostenart)) {
          nichtVereinbart.push(`${m.id}: ${zeile.bezeichnung}`);
        }
      }
    }
    const ohneVertragsgrundlage = e.umlagefaehige.filter((k) => !k.vertrag);
    p.push(
      pruefung("R-01", "Nur vertraglich vereinbarte Kostenarten umgelegt, Fundstelle benannt", "blocker",
        nichtVereinbart.length === 0 && ohneVertragsgrundlage.length === 0,
        [...nichtVereinbart, ...ohneVertragsgrundlage.map((k) => `${k.bezeichnung}: Vertragsfundstelle fehlt`)]
          .join(", ") || "alle umgelegten Kostenarten stehen in § 4 der Verträge, Fundstelle je Kostenart benannt")
    );

    // R-02: War die Kostenart im Abrechnungsjahr überhaupt noch umlagefähig?
    // (Gültigkeitsfenster, z. B. Kabel-TV nur bis 30.06.2024.)
    const abgelaufen = e.umlagefaehige.filter(
      (k) => k.umlagefaehig_bis && k.umlagefaehig_bis < e.abrechnung.von);
    p.push(
      pruefung("R-02", "Keine Kostenart außerhalb ihres Gültigkeitszeitraums umgelegt", "blocker",
        abgelaufen.length === 0,
        abgelaufen.map((k) => `${k.bezeichnung} (nur bis ${k.umlagefaehig_bis})`).join(", ") ||
          "Gültigkeitsfenster eingehalten")
    );

    // R-03: Jede Nicht-Umlage braucht eine Begründung mit Fundstelle.
    const ohneBegruendung = [];
    for (const beleg of fall.belege) {
      for (const pos of beleg.positionen) {
        if (pos.umlagefaehig) continue;
        const text = pos.begruendung || fall.kostenarten[pos.kostenart]?.betrkv || "";
        const hatFundstelle = /§|BGH|TKG|BetrKV|Urteil/i.test(text);
        if (!hatFundstelle) ohneBegruendung.push(`${beleg.beleg}: ${pos.bezeichnung}`);
      }
    }
    p.push(
      pruefung("R-03", "Jede Nicht-Umlage ist mit Fundstelle begründet", "blocker",
        ohneBegruendung.length === 0, ohneBegruendung.join(", ") || "alle begründet")
    );

    // R-04: Jede umgelegte Kostenart braucht eine BetrKV-Ziffer.
    const ohneZiffer = e.umlagefaehige.filter((k) => !/§\s*2\s*Nr\./.test(k.betrkv || ""));
    p.push(
      pruefung("R-04", "Jede umgelegte Kostenart nennt ihre BetrKV-Ziffer", "blocker",
        ohneZiffer.length === 0, ohneZiffer.map((k) => k.bezeichnung).join(", ") || "vollständig")
    );

    // R-05: Der Abrechnungszeitraum darf höchstens 12 Monate umfassen.
    p.push(
      pruefung("R-05", "Abrechnungszeitraum <= 12 Monate", "blocker",
        e.tage_im_jahr <= 366, `${e.tage_im_jahr} Tage`)
    );

    // R-06: Ausschlussfrist - die Abrechnung muss dem Mieter binnen 12 Monaten
    // nach Ende des Zeitraums zugehen (§ 556 Abs. 3 S. 2 BGB).
    const fristende = `${Number(e.abrechnung.bis.slice(0, 4)) + 1}-12-31`;
    p.push(
      pruefung("R-06", "Abrechnung innerhalb der Ausschlussfrist", "blocker",
        e.abrechnung.erstellt_am <= fristende,
        `erstellt ${e.abrechnung.erstellt_am}, Frist ${fristende}`)
    );

    // R-07: Der Soll-Ansatz ist rechtlich die Ausnahme und muss bewusst gewählt
    // sein - er darf nie stillschweigend die Voreinstellung sein.
    p.push(
      pruefung("R-07", "Vorauszahlungen nach Ist (BGH VIII ZR 57/04)",
        e.einstellungen.vorauszahlungen_ansatz === "soll" ? "warnung" : "blocker",
        e.einstellungen.vorauszahlungen_ansatz === "ist",
        e.einstellungen.vorauszahlungen_ansatz === "ist"
          ? "nur tatsächlich geleistete Vorauszahlungen angerechnet"
          : "ACHTUNG: Soll-Ansatz aktiv - muss in den Annahmen begründet werden")
    );

    // R-08: Gehört der Beleg überhaupt in dieses Abrechnungsjahr?
    // Ein Beleg aus dem Vorjahr, der versehentlich mitgebucht wird, fällt sonst
    // niemandem auf - die Summe sieht ja plausibel aus.
    const ausserhalb = [];
    for (const beleg of fall.belege) {
      // Alle Datumsangaben aus dem Leistungszeitraum ziehen; fehlt er, gilt das
      // Belegdatum. Frühestes und spätestes Datum spannen den Leistungszeitraum auf.
      const daten = (String(beleg.leistungszeitraum || "").match(/\d{2}\.\d{2}\.\d{4}/g) || [])
        .map((d) => { const [tag, monat, jahr] = d.split("."); return `${jahr}-${monat}-${tag}`; });
      const von = daten.length ? daten.reduce((a, b) => (a < b ? a : b)) : beleg.datum;
      const bis = daten.length ? daten.reduce((a, b) => (a > b ? a : b)) : beleg.datum;
      if (bis < e.abrechnung.von || von > e.abrechnung.bis) {
        ausserhalb.push(`${beleg.beleg} (Leistung ${von} bis ${bis})`);
      }
    }
    p.push(
      pruefung("R-08", "Jeder Beleg betrifft den Abrechnungszeitraum", "blocker",
        ausserhalb.length === 0,
        ausserhalb.join(", ") || `${fall.belege.length} Belege, Leistung jeweils im Zeitraum`)
    );

    // R-09: Der Kostenansatz ist EINE Einstellung für alle Kostenarten. Ein
    // Mischen wäre nur möglich, wenn es die Einstellung je Kostenart gäbe - die
    // Prüfung hält das ausdrücklich fest, statt sich stillschweigend darauf zu verlassen.
    p.push(
      pruefung("R-09", "Kostenansatz einheitlich über alle Kostenarten", "blocker",
        ["leistung", "abfluss"].includes(e.einstellungen.kostenansatz),
        `"${e.einstellungen.kostenansatz}" gilt für alle ${e.kostenarten.length} Kostenarten`)
    );

    // R-11: Weicht die verwendete Fläche vom Mietvertrag ab, muss das eine
    // begründete Entscheidung sein - kein stiller Zahlendreher.
    const mitFlaechenhinweis = e.einheiten.filter((u) => u.hinweis);
    p.push(
      pruefung("R-11", "Abweichende Wohnflächen sind als Entscheidung dokumentiert", "warnung",
        mitFlaechenhinweis.every((u) => /BGH|Aufmaß|maßgeblich/i.test(u.hinweis)),
        mitFlaechenhinweis.length
          ? mitFlaechenhinweis.map((u) => `${u.we}: begründet`).join(", ")
          : "keine abweichenden Flächenangaben")
    );

    // R-10: Diese Kostenarten dürfen niemals im umgelegten Block auftauchen.
    const niemalsUmlagefaehig = ["verwaltung", "instandhaltung", "kleinreparaturen", "neuanlage", "rechtsschutz"];
    const verbotenUmgelegt = e.umlagefaehige.filter((k) => niemalsUmlagefaehig.includes(k.schluessel));
    p.push(
      pruefung("R-10", "Verwaltung/Instandhaltung/Neuanlage nicht umgelegt", "blocker",
        verbotenUmgelegt.length === 0,
        verbotenUmgelegt.map((k) => k.bezeichnung).join(", ") ||
          "§ 1 Abs. 2 BetrKV eingehalten")
    );

    // R-13: Eine Paragrafenangabe ist für die Eigentümerin und die Mieter keine
    // Begründung. Jede tatsächlich verwendete Kostenart muss zusätzlich in
    // normaler Sprache erklären, warum sie umgelegt wird oder eben nicht.
    const ohneKlartext = e.kostenarten.filter((k) => !k.warum);
    p.push(
      pruefung("R-13", "Jede verwendete Kostenart ist in normaler Sprache begründet", "blocker",
        ohneKlartext.length === 0,
        ohneKlartext.map((k) => k.bezeichnung).join(", ") ||
          `${e.kostenarten.length} Kostenarten mit Begründung und Vertragsgrundlage`)
    );

    // R-12: Kein Befund darf unter den Tisch fallen.
    const ohneBehandlung = (fall.befunde || []).filter((b) => !b.behandlung);
    p.push(
      pruefung("R-12", "Jeder Befund hat eine dokumentierte Behandlung", "blocker",
        ohneBehandlung.length === 0,
        ohneBehandlung.map((b) => b.id).join(", ") ||
          `${(fall.befunde || []).length} Befunde dokumentiert`)
    );

    /* --- L4: Plausibilität ------------------------------------------------ */

    // P-01: Jeder Beleg muss bezahlt worden sein, und jede Abbuchung muss zu
    // einem Beleg gehören. Beide Richtungen, sonst fehlt etwas.
    // Kontoauszüge schreiben Umlaute aus ("SANITAER"), Rechnungen nicht
    // ("Sanitär"). Ohne diese Angleichung findet die Zuordnung nichts.
    const ohneUmlaute = (text) => String(text).toUpperCase()
      .replace(/Ä/g, "AE").replace(/Ö/g, "OE").replace(/Ü/g, "UE").replace(/ß/g, "SS");

    const lieferantenSummen = new Map();
    for (const b of fall.belege) {
      const kennung = b.bank_kennung;
      const eintrag = lieferantenSummen.get(kennung) || { rechnung: 0, zahlung: 0, belege: 0 };
      eintrag.rechnung += zuCent(
        typeof b.abfluss_im_abrechnungsjahr === "number" ? b.abfluss_im_abrechnungsjahr : b.rechnungsbetrag);
      eintrag.belege += 1;
      lieferantenSummen.set(kennung, eintrag);
    }
    const abbuchungenOhneBeleg = [];
    for (const buchung of fall.buchungen.filter((b) => b.betrag < 0)) {
      const treffer = [...lieferantenSummen.keys()].find((k) =>
        ohneUmlaute(buchung.gegenpartei).includes(ohneUmlaute(k)));
      if (treffer) lieferantenSummen.get(treffer).zahlung += zuCent(-buchung.betrag);
      else abbuchungenOhneBeleg.push(`${buchung.datum} ${buchung.gegenpartei}`);
    }
    const abweichungen = [...lieferantenSummen.entries()]
      .filter(([, v]) => v.rechnung !== v.zahlung)
      .map(([k, v]) => `${k}: Rechnungen ${euro(v.rechnung)} vs. Zahlungen ${euro(v.zahlung)}`);
    p.push(
      pruefung("P-01", "Belege und Kontobewegungen decken sich", "warnung",
        abweichungen.length === 0 && abbuchungenOhneBeleg.length === 0,
        [...abweichungen, ...abbuchungenOhneBeleg.map((t) => `ohne Beleg: ${t}`)].join(" | ") ||
          `${lieferantenSummen.size} Lieferanten abgeglichen`)
    );

    // P-02: Fehlt ein Mieteingang?
    const fehlendeZahlungen = e.mietverhaeltnisse
      .filter((m) => m.fehlende_zahlungen > 0)
      .map((m) => {
        const gezahlteMonate = new Set(m.zahlungen.map((z) => z.datum.slice(0, 7)));
        const erwartet = [];
        const start = alsDatum(m.nutzung_von);
        for (let i = 0; i < m.monate; i++) {
          const d = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + i, 1));
          erwartet.push(d.toISOString().slice(0, 7));
        }
        const fehlt = erwartet.filter((monat) => !gezahlteMonate.has(monat));
        return `${m.mieter} (${m.we}): ${fehlt.join(", ")} fehlt`;
      });
    p.push(
      pruefung("P-02", "Mieteingänge vollständig", "warnung",
        fehlendeZahlungen.length === 0, fehlendeZahlungen.join(" | ") || "alle Monate bezahlt")
    );

    // P-02b: Vereinbarte Staffelmiete auch tatsächlich vereinnahmt?
    const staffelabweichungen = [];
    for (const m of e.mietverhaeltnisse) {
      if (!m.staffelmiete) continue;
      let ausfallCent = 0;
      for (const zahlung of m.zahlungen) {
        const stufe = m.staffelmiete
          .filter((s) => s.ab <= zahlung.datum)
          .sort((a, b) => a.ab.localeCompare(b.ab))
          .pop();
        if (!stufe) continue;
        const gezahlteKaltmiete = zahlung.betrag_cent - zahlung.vorauszahlungsanteil_cent;
        if (zuCent(stufe.nettokaltmiete) > gezahlteKaltmiete) {
          ausfallCent += zuCent(stufe.nettokaltmiete) - gezahlteKaltmiete;
        }
      }
      if (ausfallCent > 0) {
        staffelabweichungen.push(`${m.mieter} (${m.we}): Mindereinnahme ${euro(ausfallCent)} in ${e.abrechnung.von.slice(0, 4)}`);
      }
    }
    p.push(
      pruefung("P-02b", "Vereinbarte Staffelmiete wird vereinnahmt", "warnung",
        staffelabweichungen.length === 0,
        staffelabweichungen.join(" | ") || "keine Abweichung")
    );

    return p;
  }

  /* ===========================================================================
   * TEIL 5 - EXPORT
   * ===========================================================================
   * Dieser Block sorgt dafür, dass dieselbe Datei an zwei Orten funktioniert:
   *   - im Browser, eingebunden per <script src="...">   -> window.Nebenkosten
   *   - in Node, für die Tests, per require(...)         -> module.exports
   * ========================================================================= */

  const API = {
    berechne,
    pruefeAlles,
    // Hilfsfunktionen, die auch die Oberfläche und die Tests brauchen:
    verteileCentgenau,
    zuCent,
    zuEuro,
    alsEuroText,
    alsDatumText,
    alsProzentText,
    alsZahlText,
    tageZwischen,
    monateZwischen,
  };

  if (typeof module === "object" && module.exports) module.exports = API;
  else global.Nebenkosten = API;

  <script>
/* =============================================================================
 * DAS ABRECHNUNGSSCHREIBEN
 * =============================================================================
 *
 * Erzeugt aus einem Mietverhältnis das fertige Schreiben an den Mieter - als
 * HTML-Text. Dasselbe HTML wird am Bildschirm angezeigt und gedruckt; es gibt
 * also keine zweite Fassung, die abweichen könnte.
 *
 * WAS IM SCHREIBEN STEHEN MUSS (SPEC.md § 2.1)
 * Vier Angaben entscheiden darüber, ob eine Betriebskostenabrechnung überhaupt
 * wirksam ist. Fehlt eine davon, ist das ganze Schreiben unwirksam:
 *   1. die Gesamtkosten je Kostenart          -> Spalte "Gesamtkosten Haus"
 *   2. der Verteilerschlüssel, erklärt        -> Kopfzeile + Spaltenüberschrift
 *   3. die Berechnung des Mieteranteils       -> eine Zeile je Kostenart
 *   4. der Abzug der Vorauszahlungen          -> Abrechnungsblock am Ende
 * Im Code sind diese Stellen mit MINDESTANGABE 1..4 markiert. Die Prüfungen
 * F-01 bis F-04 kontrollieren am fertigen HTML, ob sie wirklich da sind.
 * ========================================================================== */

(function (global) {
  "use strict";

  const N = global.Nebenkosten;
  const eur = N.alsEuroText;
  const dat = N.alsDatumText;
  const pro = N.alsProzentText;
  const zahl = N.alsZahlText;

  /** Macht Text sicher für HTML (aus < wird &lt; usw.). */
  function sicher(text) {
    return String(text === null || text === undefined ? "" : text).replace(
      /[&<>"]/g,
      (zeichen) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[zeichen])
    );
  }

  /**
   * Wie der Abrechnungszeitraum im Brief benannt wird.
   * Deckt sich der Zeitraum mit einem Kalenderjahr, heißt es schlicht "2025".
   * Weicht er ab (etwa bei einem abweichenden Wirtschaftsjahr), wird das
   * Datumspaar genannt. So steht nirgends eine fest eingebaute Jahreszahl.
   */
  function zeitraumBezeichnung(abrechnung) {
    const jahrVon = abrechnung.von.slice(0, 4);
    const jahrBis = abrechnung.bis.slice(0, 4);
    const ganzesKalenderjahr =
      jahrVon === jahrBis && abrechnung.von.endsWith("-01-01") && abrechnung.bis.endsWith("-12-31");
    return {
      ganzesKalenderjahr,
      kurz: ganzesKalenderjahr ? jahrVon : `${dat(abrechnung.von)} – ${dat(abrechnung.bis)}`,
      satz: ganzesKalenderjahr
        ? `das Kalenderjahr ${jahrVon}`
        : `den Zeitraum ${dat(abrechnung.von)} bis ${dat(abrechnung.bis)}`,
      jahr: jahrVon,
    };
  }

  /** Addiert Tage auf ein ISO-Datum (für die Zahlungsfrist). */
  function plusTage(iso, tage) {
    const d = new Date(iso + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + tage);
    return d.toISOString().slice(0, 10);
  }

  /**
   * Baut das komplette Schreiben.
   * @param {object} m  ein Mietverhältnis aus dem Ergebnis
   * @param {object} e  das Gesamtergebnis (für Gesamtkosten und Objektdaten)
   * @returns {string}  HTML
   */
  function schreiben(m, e) {
    const v = e.vermieterin;
    const o = e.objekt;
    const erstelltAm = e.abrechnung.erstellt_am;
    const zeitraum = zeitraumBezeichnung(e.abrechnung);
    const zahlungsfrist = plusTage(erstelltAm, e.abrechnung.zahlungsfrist_tage);

    // --- MINDESTANGABE 1 + 3: Gesamtkosten und Anteilsberechnung je Kostenart -
    const kostenzeilen = m.zeilen
      .map(
        (z) => `
      <tr>
        <td>${sicher(z.bezeichnung)}<div class="klein">${sicher(z.betrkv)}</div></td>
        <td class="r">${eur(z.gesamt_cent)}</td>
        <td class="r">${eur(z.anteil_einheit_jahr_cent)}</td>
        <td class="r">${eur(z.betrag_cent)}</td>
      </tr>`
      )
      .join("");

    // Zur Transparenz: was NICHT umgelegt wurde und warum.
    const nichtUmgelegt = e.nicht_umlagefaehige
      .map(
        (k) => `
      <tr>
        <td>${sicher(k.bezeichnung)}
          ${k.warum ? `<div class="grund">${sicher(k.warum)}</div>` : ""}
          <div class="klein">${sicher(k.betrkv)}</div></td>
        <td class="r">${eur(k.gesamt_cent)}</td>
      </tr>`
      )
      .join("");

    const zahlungszeilen = m.zahlungen
      .map(
        (z) => `
      <tr>
        <td>${dat(z.datum)}</td>
        <td>${sicher(z.zweck)}</td>
        <td class="r">${eur(z.betrag_cent)}</td>
        <td class="r">${eur(z.vorauszahlungsanteil_cent)}</td>
      </tr>`
      )
      .join("");

    // --- Ergebnissatz und Zahlungsaufforderung -------------------------------
    let ergebnisText;
    let zahlungsabsatz;
    if (m.saldo_cent > 0) {
      ergebnisText = `Nachzahlung zu Ihren Lasten`;
      zahlungsabsatz = `<p>Bitte überweisen Sie den Nachzahlungsbetrag von <b>${eur(
        m.saldo_cent
      )}</b> bis zum <b>${dat(zahlungsfrist)}</b> auf das Konto <span class="iban">${sicher(v.iban)}</span> (${sicher(
        v.bank
      )}), Verwendungszweck „Betriebskosten ${zeitraum.kurz} ${sicher(m.we)}".</p>`;
    } else if (m.saldo_cent < 0) {
      ergebnisText = `Guthaben zu Ihren Gunsten`;
      zahlungsabsatz = `<p>Das Guthaben von <b>${eur(-m.saldo_cent)}</b> überweisen wir Ihnen
        innerhalb von ${e.abrechnung.zahlungsfrist_tage} Tagen auf das uns bekannte Konto.</p>`;
    } else {
      ergebnisText = `Die Abrechnung ist ausgeglichen`;
      zahlungsabsatz = "";
    }

    // Erklärung des Zeitanteils - nur nötig, wenn nicht ganzjährig gemietet.
    const zeitErklaerung = m.ganzjahr
      ? `Sie haben die Wohnung im gesamten Abrechnungsjahr gemietet; Ihr Zeitanteil beträgt 100 %.`
      : `Ihr Mietverhältnis bestand im Abrechnungsjahr vom ${dat(m.nutzung_von)} bis ${dat(
          m.nutzung_bis
        )}. Die auf die Wohnung entfallenden Jahreskosten werden deshalb gemäß § 4 Abs. 5 Ihres
         Mietvertrags zeitanteilig aufgeteilt (${sicher(m.zeit_text)}).`;

    // Hinweis, wenn Vorauszahlungen fehlen (Ist-Ansatz).
    const fehlhinweis =
      m.fehlende_zahlungen > 0 && e.einstellungen.vorauszahlungen_ansatz === "ist"
        ? (() => {
            // WICHTIG: Die nicht geleistete Vorauszahlung ist durch diese Abrechnung bereits
            // ausgeglichen - sie fehlt in der Spalte "abzüglich Vorauszahlungen" und erhöht die
            // Nachzahlung entsprechend. Gesondert offen ist deshalb nur die Nettokaltmiete.
            // Würde man die ganze Monatsmiete zusätzlich anmahnen, wäre die Vorauszahlung
            // doppelt gefordert.
            const offeneKaltmiete = N.zuCent(m.nettokaltmiete) * m.fehlende_zahlungen;
            const bereitsAusgeglichen = m.vorauszahlung_monatlich_cent * m.fehlende_zahlungen;
            return `<div class="hinweis"><b>Hinweis zu Ihren Vorauszahlungen.</b> Für den
              Abrechnungszeitraum sind ${m.monate} monatliche Vorauszahlungen vereinbart; auf dem
              Objektkonto sind ${m.zahlungen.length} Mietzahlungen eingegangen. Angerechnet werden
              können nur die tatsächlich geleisteten Vorauszahlungen. Der nicht geleistete Anteil
              von ${eur(bereitsAusgeglichen)} ist damit <b>in dieser Abrechnung bereits
              berücksichtigt</b> und wird nicht noch einmal gefordert. Gesondert offen bleibt allein
              die Nettokaltmiete von ${eur(offeneKaltmiete)}. Sollten Sie die Zahlung nachweisen
              können, korrigieren wir die Abrechnung selbstverständlich.</div>`;
          })()
        : "";

    // Anpassung der Vorauszahlung - nur bei laufendem Mietverhältnis sinnvoll.
    const laufend = m.nutzung_bis === e.abrechnung.bis;
    const anpassung = laufend
      ? `<h2>Anpassung Ihrer Vorauszahlung</h2>
         <p>Auf Ihre Wohnung entfällt ein Jahresbetrag von ${eur(m.jahresanteil_einheit_cent)},
         das sind rund ${eur(Math.round(m.jahresanteil_einheit_cent / 12))} je Monat. Ihre bisherige
         Vorauszahlung von ${eur(m.vorauszahlung_monatlich_cent)} deckt diesen Betrag nicht.
         Wir passen die monatliche Betriebskostenvorauszahlung daher gemäß § 560 Abs. 4 BGB ab dem
         übernächsten Monat nach Zugang dieses Schreibens auf <b>${eur(
           m.empfohlene_vorauszahlung_cent
         )}</b> an.</p>`
      : "";

    const anschrift = m.anschrift_hinweis
      ? `<span class="offen">[Anschrift ergänzen — ${sicher(m.anschrift_hinweis)}]</span>`
      : `${sicher(o.strasse)}<br>${sicher(o.plz_ort)}`;

    const flaechenhinweis = m.hinweis
      ? `<p class="klein">${sicher(m.hinweis)}</p>`
      : "";

    return `
<article class="schreiben" data-mietverhaeltnis="${sicher(m.id)}">

  <header class="briefkopf">
    <div><b>${sicher(v.name)}</b><br>vertreten durch ${sicher(v.vertreten_durch)} ·
      ${sicher(v.strasse)} · ${sicher(v.plz_ort)}</div>
    <div class="rechts">Objekt ${sicher(o.strasse)}<br>${sicher(o.plz_ort)}</div>
  </header>

  <div class="datumzeile">Köln, ${dat(erstelltAm)}<br>Wohnung ${sicher(m.we)} · ${sicher(m.lage || "")}</div>

  <div class="anschriftenfeld">
    <div class="absenderzeile">${sicher(v.name)} · ${sicher(v.strasse)} · ${sicher(v.plz_ort)}</div>
    ${sicher(m.mieter)}<br>${anschrift}
  </div>

  <h1>Betriebskostenabrechnung ${zeitraum.kurz}</h1>
  <div class="untertitel">Abrechnungszeitraum ${dat(e.abrechnung.von)} – ${dat(
      e.abrechnung.bis
    )} · ${sicher(o.bezeichnung)}</div>

  <!-- MINDESTANGABE 2: Verteilerschlüssel, angegeben und erläutert -->
  <table class="eckdaten">
    <tr><td>Ihre Wohnung</td><td>${sicher(m.we)}, ${sicher(m.lage || "")}</td></tr>
    <tr><td>Wohnfläche</td><td>${zahl(m.wohnflaeche_qm)} m² von ${zahl(
      e.flaeche_gesamt_qm
    )} m² Gesamtwohnfläche — Ihr Anteil beträgt ${pro(m.flaechen_anteil)}</td></tr>
    <tr><td>Ihr Nutzungszeitraum</td><td>${dat(m.nutzung_von)} – ${dat(m.nutzung_bis)} (${sicher(
      m.zeit_text
    )})</td></tr>
    <tr><td>Verteilerschlüssel</td><td>Wohnfläche — für sämtliche Kostenarten
      (§ 4 Abs. 3 Mietvertrag, § 556a Abs. 1 BGB)</td></tr>
  </table>
  ${flaechenhinweis}

  <p class="anrede">${sicher(m.anrede)}</p>
  <p>hiermit rechnen wir die Betriebskosten für ${zeitraum.satz} ab. Die Gesamtkosten des
  Hauses werden nach dem Verhältnis der Wohnflächen auf die vier Wohnungen verteilt.
  ${zeitErklaerung}</p>

  <p>Umgelegt wird eine Kostenart nur dann, wenn <b>beides</b> zutrifft: Sie ist in § 2 der
  Betriebskostenverordnung aufgeführt <b>und</b> sie ist in § 4 Ihres Mietvertrags vereinbart. Die
  Nummer hinter jeder Kostenart verweist auf die entsprechende Stelle der Verordnung. Kosten, auf
  die das nicht zutrifft, sind am Ende dieses Schreibens aufgeführt — sie trägt die Vermieterin.</p>

  <!-- MINDESTANGABE 1 (Spalte 2) und 3 (Spalten 3 und 4) -->
  <table class="kosten">
    <thead>
      <tr>
        <th>Kostenart</th>
        <th class="r">Gesamtkosten Haus</th>
        <th class="r">Anteil Ihrer Wohnung<div class="klein">${pro(
          m.flaechen_anteil
        )}, ganzes Jahr</div></th>
        <th class="r">Ihr Anteil<div class="klein">${sicher(m.zeit_text)}</div></th>
      </tr>
    </thead>
    <tbody>
      ${kostenzeilen}
      <tr class="summe">
        <td>Summe umlagefähige Betriebskosten</td>
        <td class="r">${eur(e.summe_umlagefaehig_cent)}</td>
        <td class="r">${eur(m.jahresanteil_einheit_cent)}</td>
        <td class="r">${eur(m.summe_cent)}</td>
      </tr>
      <!-- MINDESTANGABE 4: Abzug der Vorauszahlungen -->
      <tr>
        <td colspan="3">abzüglich Ihrer Vorauszahlungen (${
          m.zahlungen.length
        } × ${eur(m.vorauszahlung_monatlich_cent)})</td>
        <td class="r">− ${eur(m.vorauszahlung_angesetzt_cent)}</td>
      </tr>
      <tr class="ergebnis">
        <td colspan="3">${ergebnisText}</td>
        <td class="r">${eur(Math.abs(m.saldo_cent))}</td>
      </tr>
    </tbody>
  </table>

  ${zahlungsabsatz}
  ${fehlhinweis}
  ${anpassung}

  <h2>Ihre Zahlungseingänge im Abrechnungszeitraum</h2>
  <table class="kosten">
    <thead><tr><th>Datum</th><th>Verwendungszweck</th><th class="r">Zahlung</th>
      <th class="r">davon Vorauszahlung</th></tr></thead>
    <tbody>
      ${zahlungszeilen}
      <tr class="summe"><td colspan="3">Summe Ihrer Vorauszahlungen</td>
        <td class="r">${eur(m.vorauszahlung_ist_cent)}</td></tr>
    </tbody>
  </table>

  <h2>Zu Ihrer Information: nicht umgelegte Kosten</h2>
  <p>Für das Haus sind ${zeitraum.ganzesKalenderjahr ? zeitraum.jahr : "im Abrechnungszeitraum"} weitere Kosten angefallen, die keine umlagefähigen Betriebskosten sind
  und deshalb von der Vermieterin getragen werden. Wir führen sie auf, damit Sie nachvollziehen
  können, was <i>nicht</i> in Ihre Abrechnung eingeflossen ist:</p>
  <table class="kosten">
    <thead><tr><th>Position</th><th class="r">Betrag</th></tr></thead>
    <tbody>
      ${nichtUmgelegt}
      <tr class="summe"><td>Summe nicht umgelegt</td>
        <td class="r">${eur(e.summe_nicht_umlagefaehig_cent)}</td></tr>
    </tbody>
  </table>

  <div class="abschluss">
  <h2>Herleitung und Belege</h2>
  <p>Rechenweg je Zeile: Gesamtkosten × Wohnflächenanteil (${zahl(m.wohnflaeche_qm)} m² /
  ${zahl(e.flaeche_gesamt_qm)} m²) × Zeitanteil (${sicher(m.zeit_text)}). Die Beträge sind so auf
  Cent gerundet, dass die Summe aller Wohnungen exakt den Gesamtkosten entspricht.</p>
  <p>Sämtliche Belege — Grundbesitzabgabenbescheid, Jahresrechnung der RheinEnergie,
  Versicherungsbeitrag, Hauswart-, Reinigungs- und Gartenpflegerechnungen, Schornsteinfeger und
  Rauchwarnmelderwartung — können Sie nach Terminvereinbarung einsehen. Einwendungen gegen diese
  Abrechnung teilen Sie uns bitte gemäß § 556 Abs. 3 Satz 5 BGB innerhalb von zwölf Monaten nach
  Zugang mit.</p>

  <p class="gruss">Mit freundlichen Grüßen<br><br>${sicher(v.name)}<br>${sicher(
      v.vertreten_durch
    )}</p>
  </div>

  <footer class="brieffuss">
    Betriebskostenabrechnung ${zeitraum.kurz} · ${sicher(m.we)} · ${sicher(m.mieter)} · erstellt am
    ${dat(erstelltAm)}. Heizung und Warmwasser werden nicht abgerechnet: Ihre Wohnung hat eine
    eigene Gas-Etagenheizung mit eigenem Liefervertrag.
  </footer>
</article>`;
  }

  /* -------------------------------------------------------------------------
   * PRÜFUNGEN AM FERTIGEN SCHREIBEN (SPEC.md § 5, Gruppe F)
   * Diese Prüfungen können erst laufen, wenn das Schreiben gebaut ist - sie
   * schauen in das erzeugte HTML hinein. Damit ist sichergestellt, dass die
   * Mindestangaben nicht nur berechnet, sondern auch abgedruckt wurden.
   * ----------------------------------------------------------------------- */
  function pruefeSchreiben(m, e) {
    const html = schreiben(m, e);
    const ergebnisse = [];
    const pruefe = (id, titel, bestanden, befund) =>
      ergebnisse.push({ id, titel, schwere: "blocker", bestanden, befund, mietverhaeltnis: m.id });

    pruefe("F-01", "Gesamtkosten je Kostenart abgedruckt",
      html.includes("Gesamtkosten Haus") && html.includes(N.alsEuroText(e.summe_umlagefaehig_cent)),
      "Spalte und Summe vorhanden");

    pruefe("F-02", "Verteilerschlüssel genannt und erläutert",
      html.includes("Verteilerschlüssel") &&
        html.includes("Gesamtwohnfläche") &&
        html.includes(N.alsProzentText(m.flaechen_anteil)) &&
        (m.ganzjahr || html.includes(m.zeit_text)),
      "Fläche, Prozentsatz und Zeitanteil angegeben");

    pruefe("F-03", "Anteilsberechnung je Kostenart sichtbar",
      m.zeilen.every((z) => html.includes(N.alsEuroText(z.betrag_cent))),
      `${m.zeilen.length} Kostenartenzeilen`);

    pruefe("F-04", "Vorauszahlungen abgezogen und Saldo ausgewiesen",
      html.includes("abzüglich Ihrer Vorauszahlungen") &&
        html.includes(N.alsEuroText(Math.abs(m.saldo_cent))),
      "Abzug und Ergebnis vorhanden");

    pruefe("F-05", "Adressat, Zeitraum, Einheit und Datum vorhanden",
      html.includes(m.mieter) &&
        html.includes(N.alsDatumText(e.abrechnung.von)) &&
        html.includes(m.we) &&
        html.includes(N.alsDatumText(e.abrechnung.erstellt_am)),
      "vollständig");

    pruefe("F-06", "Hinweis auf Einwendungsfrist und Belegeinsicht",
      html.includes("556 Abs. 3") && html.includes("einsehen"), "enthalten");
    ergebnisse[ergebnisse.length - 1].schwere = "warnung";

    // F-07: Die Vorauszahlung darf sich nur durch eine ausdrückliche Erklärung
    // ändern (§ 560 Abs. 4 BGB). Bei beendeten Mietverhältnissen entfällt sie.
    const laufendesMietverhaeltnis = m.nutzung_bis === e.abrechnung.bis;
    pruefe("F-07", "Vorauszahlungsanpassung als ausdrückliche Erklärung",
      !laufendesMietverhaeltnis || (html.includes("560 Abs. 4") && html.includes("Anpassung Ihrer Vorauszahlung")),
      laufendesMietverhaeltnis ? "eigener Absatz mit Rechtsgrundlage vorhanden"
        : "entfällt: Mietverhältnis endete im Abrechnungszeitraum");
    ergebnisse[ergebnisse.length - 1].schwere = "warnung";

    pruefe("F-08", "Keine offenen Platzhalter im Schreiben",
      !html.includes('class="offen"'),
      m.anschrift_hinweis ? "ACHTUNG: Anschrift fehlt noch" : "keine Platzhalter");

    return ergebnisse;
  }

  /* -------------------------------------------------------------------------
   * DAS VERSANDFERTIGE SCHREIBEN
   * Ruft erst die Prüfungen auf und setzt, falls etwas Blockierendes offen ist,
   * sichtbar ein ENTWURF-Band über das Schreiben. So kann ein Schreiben, das
   * noch nicht versandt werden darf, nicht versehentlich verschickt werden -
   * man sieht es auf dem Papier (SPEC.md Q-04, "fail-closed").
   * ----------------------------------------------------------------------- */
  function schreibenFertig(m, e) {
    const offeneBlocker = pruefeSchreiben(m, e).filter(
      (p) => !p.bestanden && p.schwere === "blocker"
    );

    let ustVerteilt = false;

      const summePositionen = Math.round(positionen.reduce((s, p) => s + p.betrag, 0) * 100);
      const passtZuNetto = summePositionen === Math.round(nettoBetrag * 100);
      const bruttoStimmt = Math.round((nettoBetrag + ustBetrag) * 100) === Math.round(bruttoBetrag * 100);

      if (passtZuNetto && bruttoStimmt) {

          Math.round(ustBetrag * 100),
          positionen.map((p) => Math.round(p.betrag * 100))
        );
        positionen = positionen.map((p, i) => ({
          ...p,
          betrag: Math.round(p.betrag * 100 + anteile[i]) / 100,
          netto: p.betrag,

      datum_art: leistungsdatum ? "Leistungsdatum" : rechnungsdatum ? "Rechnungsdatum" : null,

      leistungszeitraum: zeitraum ? zeitraum.roh.replace(/\s+/g, " ") : null,
      rechnungsbetrag: bruttoBetrag,

      ust_auf_positionen_verteilt: ustVerteilt,

        // Karte, und ein Mensch nimmt ihn an oder lehnt ihn ab.
        vorschlag_umlage: baueUmlageVorschlag(p.erkennung, kostenarten, mietverhaeltnisse),
